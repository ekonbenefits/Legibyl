# Audits the workflows with zizmor (https://docs.zizmor.sh), its findings uploaded to code
# scanning (the Security tab, and on a pull request's lines). See #233.
name: zizmor

on:
  push:
    branches: [master]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload its findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: true
