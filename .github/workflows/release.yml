# Builds Legibyl's app for each platform it supports and, for a version tag, signs the Windows builds
# and makes a draft release of them all, with the source, which a person publishes (#233). (The CLI
# is released as a .NET tool, on NuGet.)
#
# The source: each release has Legibyl's own, and points to its dependencies', which is a release
# of its own, deps-<fingerprint>, made once for each set of dependencies (tools/source-bundle.fsx):
# the first release built with a new set makes it, as a draft beside its own, to publish with it.
#
# A tag is v<Version> (Directory.Build.props), e.g. v1.28.1.0, or with a suffix for a prerelease,
# e.g. v1.28.1.0-rc1. Run by hand on a branch, it builds and tests everything, unsigned, and keeps
# the builds as the run's artifacts: no signing, no release.
#
# Nothing here is cached: a cache restored into a run that publishes a release could be poisoned.
# The downloads the build makes (models, tessdata, fonts, veraPDF) are pinned by SHA-256 anyway.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # The fingerprint of the dependencies the release is built with: the name of the release with
  # their source, which each build says (About, legibyl --version).
  fingerprint:
    name: Dependencies' fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # What the script reads: the app's and the CLI's restored packages, and veraPDF's jar.
      - name: Build what the dependencies are read from
        run: |
          dotnet restore src/Legibyl.Gui/Legibyl.Gui.fsproj
          dotnet build src/Legibyl.Cli/Legibyl.Cli.fsproj -c Release

      - name: Fingerprint
        id: fingerprint
        env:
          GITHUB_TOKEN: ${{ github.token }} # to look up packages' submodules past GitHub's anonymous limit
        run: |
          fingerprint=$(dotnet fsi tools/source-bundle.fsx --fingerprint | tail -1)
          if [[ ! "$fingerprint" =~ ^deps-[0-9a-f]{12}$ ]]; then echo "::error title=Fingerprint::Got '$fingerprint'."; exit 1; fi
          echo "The dependencies' source: $fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.rid }})
    needs: fingerprint
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RID: ${{ matrix.rid }}
      # Stamped into the build (MSBuild reads it as a property), which says it.
      DependencySource: ${{ needs.fingerprint.outputs.fingerprint }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The version the build stamps; a tag has to name it.
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: bash tools/ci/release-version.sh

      - name: Build
        run: dotnet build Legibyl.slnx -c Release

      # Each fails if fewer of its tests ran than it has (see tools/ci/test.sh). The GUI's tests
      # run in CI, on every push to master.
      - name: Validation tests
        env:
          CONFIGURATION: Release
        run: bash tools/ci/test.sh tests/Legibyl.Validation.Tests

      - name: CLI tests
        env:
          CONFIGURATION: Release
        run: bash tools/ci/test.sh tests/Legibyl.Cli.Tests

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash tools/ci/release-publish.sh

      - name: Keep the test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults/
          retention-days: 7

      # Windows' builds are packed once they're signed (below); the others are packed already.
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ startsWith(matrix.rid, 'win-') && 'unsigned' || 'build' }}-${{ matrix.rid }}
          path: artifacts/release/dist/
          if-no-files-found: error
          retention-days: 7

  # Signs Legibyl's own program and libraries in the Windows builds, builds each MSI from the signed
  # files, signs it, and packs them. Only for a tag, in the release environment: it waits for a
  # reviewer, and only its jobs can sign in to Azure (OIDC, no stored secret) to sign.
  sign-windows:
    name: Sign (${{ matrix.rid }})
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write # to sign in to Azure Artifact Signing with OIDC
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ matrix.rid }}
          path: payload

      # Legibyl's own: the GUI's program and Legibyl's libraries. The others (.NET's,
      # Avalonia's, IKVM's, the native libraries) are left as their makers shipped them.
      - name: List what to sign
        id: files
        shell: pwsh
        run: |
          $files = Get-ChildItem payload -Recurse -File -Include 'Legibyl*.exe', 'Legibyl*.dll' | ForEach-Object FullName
          if ($files.Count -lt 3) { throw "Found only $($files.Count) of Legibyl's files to sign." }
          $files
          "list<<EOF" >> $env:GITHUB_OUTPUT
          $files >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the program and libraries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.files.outputs.list }}
          file-digest: SHA256
          timestamp-digest: SHA256
          # Its default, but said: a cache restored here could be poisoned (see the top).
          cache-dependencies: false

      - name: Build the MSI
        shell: pwsh
        run: dotnet build installer/Legibyl.Gui.Installer/Legibyl.Gui.Installer.wixproj -c Release -p:PublishGui=false "-p:GuiPublishDir=$PWD\payload\gui" "-p:GuiRuntime=$env:RID"

      # The MSI's description is what Windows names it when it asks to install it.
      - name: Sign the MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\msi\en-US\LegibylSetup.msi
          file-digest: SHA256
          timestamp-digest: SHA256
          # Its default, but said: a cache restored here could be poisoned (see the top).
          cache-dependencies: false
          description: Legibyl
          description-url: https://github.com/${{ github.repository }}

      - name: Check the signatures and pack
        shell: pwsh
        run: |
          $msi = 'artifacts\msi\en-US\LegibylSetup.msi'
          foreach ($file in @($msi) + (Get-ChildItem payload -Recurse -File -Include 'Legibyl*.exe', 'Legibyl*.dll' | ForEach-Object FullName)) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file isn't signed ($($signature.Status): $($signature.StatusMessage))." }
          }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $msi "dist\Legibyl-$env:VERSION-$env:RID.msi"
          Rename-Item payload\gui "Legibyl-$env:VERSION-$env:RID"
          Compress-Archive "payload\Legibyl-$env:VERSION-$env:RID" "dist\Legibyl-$env:VERSION-$env:RID.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The source: Legibyl's own, always; and its dependencies', unless their release is published
  # already (a draft of it isn't seen here: this job can't see drafts, so it gathers it again, and
  # the release job keeps the draft).
  source:
    name: Source
    if: ${{ github.ref_type == 'tag' }}
    needs: fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build what the dependencies are read from
        run: |
          dotnet restore src/Legibyl.Gui/Legibyl.Gui.fsproj
          dotnet build src/Legibyl.Cli/Legibyl.Cli.fsproj -c Release

      - name: Is their source released already?
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$FINGERPRINT" > /dev/null 2>&1; then
            echo "$FINGERPRINT is released: only Legibyl's own source is gathered."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "$FINGERPRINT isn't released: all the source is gathered."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # About 6 GB: what was fetched, then packed. The runner has about 14 GB free, less what's
      # restored, so its preinstalled SDKs that Legibyl doesn't use go.
      - name: Make room
        if: ${{ steps.released.outputs.released == 'false' }}
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Gather it
        env:
          GITHUB_TOKEN: ${{ github.token }} # to look up packages' submodules past GitHub's anonymous limit
          RELEASED: ${{ steps.released.outputs.released }}
        run: |
          if [ "$RELEASED" = true ]; then own=--own; else own=; fi
          dotnet fsi tools/source-bundle.fsx $own | tee bundle.log
          # The same dependencies the builds name.
          got=$(grep -o "fingerprint: deps-[0-9a-f]*" bundle.log | tail -1 | cut -d' ' -f2)
          if [ "$got" != "$FINGERPRINT" ]; then
            echo "::error title=Source::The source gathered is of the dependencies $got, not $FINGERPRINT, which the builds name."
            exit 1
          fi
          ls -la artifacts/source/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: artifacts/source/release/legibyl-*-source.tar
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.released.outputs.released == 'false' }}
        with:
          name: dependency-source
          path: artifacts/source/release/${{ needs.fingerprint.outputs.fingerprint }}/
          if-no-files-found: error
          compression-level: 0 # tarballs already
          retention-days: 1

  # A draft release of every platform's builds and the source, with their checksums; and, the first
  # time a set of dependencies is released, a draft of their source's release. A person publishes them.
  release:
    name: Draft release
    if: ${{ github.ref_type == 'tag' }}
    needs: [fingerprint, build, sign-windows, source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to create the draft release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: dist

      # Made once for each set of dependencies, and never changed: a new set is a new fingerprint.
      # (Drafts are seen here.)
      - name: Has the dependencies' source a release?
        id: deps
        run: |
          if gh release view "$FINGERPRINT" > /dev/null 2>&1; then
            echo "$FINGERPRINT has its release already: it's linked to."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$FINGERPRINT has no release yet: it's made, as a draft."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.deps.outputs.exists == 'false' }}
        with:
          name: dependency-source
          path: deps

      # A prerelease, so it's never the latest release.
      - name: Release the dependencies' source
        if: ${{ steps.deps.outputs.exists == 'false' }}
        run: |
          ls -la deps
          gh release create --draft --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Legibyl's dependencies' source ($FINGERPRINT)" --notes-file deps/SOURCE-README.md \
            "$FINGERPRINT" deps/*
          echo "**Publish $FINGERPRINT before Legibyl $VERSION**: it's a new draft too, the source of its dependencies, which Legibyl's release links to." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the draft
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          ## Downloads

          | Platform | Download |
          |---|---|
          | Windows x64 | \`Legibyl-$VERSION-win-x64.msi\` (installer), or \`.zip\` |
          | Windows Arm64 | \`Legibyl-$VERSION-win-arm64.msi\` (installer), or \`.zip\` |
          | macOS (Apple silicon) | \`Legibyl-$VERSION-osx-arm64.dmg\` |
          | Linux x64 | \`Legibyl-$VERSION-linux-x64.tar.gz\` |
          | Linux Arm64 | \`Legibyl-$VERSION-linux-arm64.tar.gz\` |

          \`SHA256SUMS\` has each file's checksum.

          The Windows installers and app are signed by Qualified Benefits Consultants, Inc. (doing business as Ekon Benefits). The macOS app isn't signed yet: the first time, open it from System Settings > Privacy & Security > **Open Anyway**.

          ## Source

          Legibyl is free software under the AGPL-3.0-or-later. Its source for this release is \`legibyl-$VERSION-source.tar\` (with \`MANIFEST.md\`, every component it's built with). The source of everything it's built with is the release [$FINGERPRINT](https://github.com/$GH_REPO/releases/tag/$FINGERPRINT), shared by every release built with the same dependencies; \`legibyl --version\` and About name it too.
          EOF
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create --draft --verify-tag "${prerelease[@]}" --title "Legibyl $VERSION" --notes-file ../notes.md "$TAG" ./*
